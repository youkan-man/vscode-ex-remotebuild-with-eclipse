<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src __CSP__; script-src 'nonce-__NONCE__';">
<link rel="stylesheet" href="__STYLE__"><title>Eclipse Remote Build</title></head>
<body>
<header><h1>Eclipse Remote Build <span>__VERSION__</span></h1><span id="dirty" role="status"></span></header>
<div class="toolbar" aria-label="ビルド操作"><button id="build">同期してビルド</button><button id="sync" class="secondary">同期のみ</button><button id="deploy" class="secondary">Dockerへデプロイ</button><button id="save" class="secondary">設定を保存</button><button id="reload" class="secondary">ファイルを再読込</button></div>
<div id="target" class="target" aria-live="polite"></div><div id="run" class="run" hidden></div><div id="status" role="status" aria-live="polite"></div>
<main>
<section aria-labelledby="profiles-title"><div class="heading"><h2 id="profiles-title">ビルドプロファイル</h2><button id="addProfile" class="secondary">追加</button></div>
<div class="profiles-layout"><div class="profile-list"><table><thead><tr><th>選択</th><th>名前</th><th>プロジェクト / 構成</th><th>適用元</th></tr></thead><tbody id="profiles"></tbody></table><div id="emptyProfiles" hidden>プロファイルなし</div></div><div id="editor"></div></div></section>
<section aria-labelledby="connection-title"><h2 id="connection-title">接続先</h2><div id="connection" class="fields"></div></section>
<section aria-labelledby="sync-title"><h2 id="sync-title">転送対象</h2><div id="transfer" class="fields"></div></section>
<section aria-labelledby="image-title"><div class="heading"><h2 id="image-title">Eclipse・ツールチェーン</h2><button id="addArchive" class="secondary">アーカイブ追加</button></div><div id="image" class="fields"></div>
<div class="archive-wrap"><table><thead><tr><th>アーカイブ（ワークスペース相対）</th><th>展開先（コンテナ）</th><th>除去階層数</th><th>操作</th></tr></thead><tbody id="archives"></tbody></table></div></section>
</main>
<script nonce="__NONCE__">window.initialState=__STATE__;</script><script nonce="__NONCE__" src="__SCRIPT__"></script>
</body></html>
