<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__'"><title>Eclipse Remote Build</title><style nonce="__NONCE__">
:root{color-scheme:light dark}*{box-sizing:border-box}body{font:13px var(--vscode-font-family,system-ui);color:var(--vscode-foreground,#ddd);background:var(--vscode-editor-background,#181818);margin:0;padding:24px;max-width:1200px;margin-inline:auto}h1{font-size:24px;font-weight:600;margin:0 0 8px}h2{font-size:15px;margin:0 0 14px}.hint{color:var(--vscode-descriptionForeground,#999);line-height:1.6;margin:6px 0 16px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;padding:12px 0;background:var(--vscode-editor-background,#181818);z-index:2}.toolbar select{width:180px}section{border:1px solid var(--vscode-panel-border,#414141);padding:18px;margin:16px 0;border-radius:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}label{font-weight:500}input,textarea,select{font:inherit;width:100%;color:var(--vscode-input-foreground,#eee);background:var(--vscode-input-background,#292929);border:1px solid var(--vscode-input-border,#555);border-radius:2px;padding:8px}textarea{min-height:76px;resize:vertical;font-family:var(--vscode-editor-font-family,monospace)}button{font:inherit;cursor:pointer;border:1px solid transparent;border-radius:3px;padding:8px 12px;background:var(--vscode-button-background,#087eb7);color:var(--vscode-button-foreground,#fff)}button:active{transform:translateY(1px);filter:brightness(.85)}button:disabled{opacity:.5;cursor:wait}.secondary{background:var(--vscode-button-secondaryBackground,#333);color:var(--vscode-button-secondaryForeground,#ddd)}.pick{display:flex;gap:6px}.pick input{min-width:0}.pick button{flex-shrink:0}.row{padding:14px 0;border-top:1px solid var(--vscode-panel-border,#414141)}.remove{margin-top:10px}.status{padding:4px 0;min-height:24px;white-space:pre-wrap;line-height:1.5}.error{color:var(--vscode-errorForeground,#f48771)}.wide{grid-column:1/-1}input:focus,textarea:focus,select:focus,button:focus-visible{outline:1px solid var(--vscode-focusBorder,#007fd4);outline-offset:1px}@media(max-width:620px){body{padding:12px}.toolbar select{width:100%}}
</style></head><body><h1>Eclipse Remote Build</h1><p class="hint">ソースとプロファイルを差分転送して、Docker内のEclipseでビルドします。</p><div class="toolbar"><select id="selected" aria-label="使用するビルドプロファイル"></select><button id="build">同期してビルド</button><button id="sync" class="secondary">同期のみ</button><button id="provision" class="secondary">環境を構築・起動</button><button id="save" class="secondary">設定を保存</button></div><div id="status" class="status" role="status" aria-live="polite"></div><main id="app"></main>
<script nonce="__NONCE__">
const vscode=acquireVsCodeApi();let data=__DATA__;
const app=document.getElementById('app'),status=document.getElementById('status'),selected=document.getElementById('selected');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=p=>p.split('.').reduce((o,k)=>o?.[k],data);
function set(p,value){const keys=p.split('.');let o=data;for(const k of keys.slice(0,-1))o=o[k];o[keys.at(-1)]=value;}
function field(label,p,kind='text',browse=false){const input='<input aria-label="'+esc(label)+'" data-path="'+p+'" type="'+kind+'" value="'+esc(get(p))+'">';return '<div class="field"><label>'+esc(label)+'</label>'+(browse?'<div class="pick">'+input+'<button class="secondary" data-pick="'+p+'">選択</button></div>':input)+'</div>';}
function list(label,p){return '<div class="field"><label>'+esc(label)+'</label><textarea aria-label="'+esc(label)+'" data-list="'+p+'">'+esc(get(p).join('\n'))+'</textarea></div>';}
function profiles(){const value=selected.value;selected.innerHTML=data.profiles.map(p=>'<option value="'+esc(p.name)+'">'+esc(p.name)+'</option>').join('');if(data.profiles.some(p=>p.name===value))selected.value=value;}
function rows(){
 document.getElementById('archives').innerHTML=data.provision.archives.map((a,i)=>'<div class="row"><div class="grid">'+field('アーカイブ '+(i+1),'provision.archives.'+i+'.source','text',true)+field('コンテナ内の展開先','provision.archives.'+i+'.destination')+field('除去する先頭階層数','provision.archives.'+i+'.stripComponents','number')+'</div><button class="secondary remove" data-remove-archive="'+i+'">このアーカイブを削除</button></div>').join('');
 document.getElementById('profiles').innerHTML=data.profiles.map((p,i)=>{const base='profiles.'+i+'.';return '<article class="row"><div class="grid">'+field('プロファイル名',base+'name')+field('構成JSON（任意・毎回読み込み）',base+'profileFile','text',true)+field('Eclipseプロジェクト名',base+'project')+field('ビルド構成',base+'configuration')+field('Eclipse実行ファイル',base+'eclipseExecutable')+field('Eclipseワークスペース',base+'eclipseWorkspace')+list('インポート元（1行1パス）',base+'imports')+list('追加引数（1行1引数）',base+'extraArgs')+'<div class="field"><label>環境変数（文字列のJSONオブジェクト）</label><textarea aria-label="環境変数 '+esc(p.name)+'" data-json="'+base+'environment">'+esc(JSON.stringify(p.environment,null,2))+'</textarea></div></div><button class="secondary remove" data-remove-profile="'+i+'">このプロファイルを削除</button></article>';}).join('');profiles();
}
function draw(){
 app.innerHTML='<section><h2>SSH接続</h2><div class="grid">'+field('ホスト / SSH設定の別名','ssh.host')+field('ユーザー','ssh.user')+field('ポート','ssh.port','number')+field('秘密鍵（空欄ならSSHの既定値）','ssh.identityFile')+'</div></section>'+
 '<section><h2>Dockerのビルド環境</h2><div class="grid">'+field('ホスト側の転送先','remote.root')+field('コンテナ名','remote.container')+field('Dockerコマンド','remote.dockerCommand')+'</div></section>'+
 '<section><h2>転送対象</h2><p class="hint">すべてワークスペース基準です。明示したプロファイルは除外設定にかかわらず転送します。削除したファイルのリモート削除は行いません。</p><div class="grid">'+list('ソース（1行1パス）','sync.include')+list('除外パターン（1行1件）','sync.exclude')+list('追加のビルドプロファイル（1行1パス）','sync.profileFiles')+'</div></section>'+
 '<section><h2>Eclipse・ツールチェーンの展開</h2><p class="hint">TAR / ZIPを指定した順に展開します。Dockerfileは空欄で内蔵のUbuntu構成を使用。独自DockerfileにはPython 3.12相当の環境が必要です。</p><div class="grid">'+field('ベースイメージ','provision.baseImage')+field('作成するイメージ','provision.image')+field('Dockerfile（空欄で内蔵）','provision.dockerfile','text',true)+'</div><div id="archives"></div><button class="secondary" id="addArchive">＋ アーカイブ</button></section>'+
 '<section><h2>ビルドプロファイル</h2><p class="hint">構成JSONはこの欄の項目を上書きします。JSON内の相対パスもJSONの場所ではなくワークスペース基準です。追加引数・環境変数の ${workspaceFolder} は /workspace に変換します。</p><div id="profiles"></div><button class="secondary" id="addProfile">＋ プロファイル</button></section>';
 rows();
}
function readJson(){for(const t of app.querySelectorAll('[data-json]')){const value=JSON.parse(t.value);if(!value||Array.isArray(value)||typeof value!=='object'||!Object.values(value).every(v=>typeof v==='string'))throw Error('環境変数は文字列のJSONオブジェクトにしてください');set(t.dataset.json,value);}}
app.addEventListener('input',e=>{const t=e.target;if(t.dataset.path){set(t.dataset.path,t.type==='number'?Number(t.value):t.value);if(t.dataset.path.endsWith('.name'))profiles();}if(t.dataset.list)set(t.dataset.list,t.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean));});
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;try{if(t.dataset.pick){vscode.postMessage({action:'pick',field:t.dataset.pick});return;}readJson();if(t.id==='addArchive')data.provision.archives.push({source:'',destination:'/opt/eclipse',stripComponents:1});else if(t.id==='addProfile'){let i=data.profiles.length+1;while(data.profiles.some(p=>p.name==='Profile '+i))i++;data.profiles.push({name:'Profile '+i,profileFile:'',project:'MyProject',configuration:'Release',eclipseExecutable:'/opt/eclipse/eclipse',eclipseWorkspace:'/tmp/eclipse-workspace',imports:['.'],extraArgs:[],environment:{}});}else if(t.dataset.removeArchive!==undefined)data.provision.archives.splice(Number(t.dataset.removeArchive),1);else if(t.dataset.removeProfile!==undefined)data.profiles.splice(Number(t.dataset.removeProfile),1);else return;rows();}catch(e){status.className='status error';status.textContent=e.message;}});
for(const action of ['save','sync','build','provision'])document.getElementById(action).addEventListener('click',()=>{try{readJson();status.className='status';status.textContent='実行中… 詳細は「出力」パネルに表示します。';vscode.postMessage({action,data,profile:selected.value});}catch(e){status.className='status error';status.textContent=e.message;}});
window.addEventListener('message',e=>{const m=e.data;if(m.field&&m.value!==undefined){set(m.field,m.value);const input=app.querySelector('[data-path="'+m.field+'"]');if(input)input.value=m.value;}if(m.busy!==undefined)document.querySelectorAll('button,input,textarea,select').forEach(el=>el.disabled=m.busy);if(m.error||m.info){status.className='status'+(m.error?' error':'');status.textContent=m.error||m.info;}});
for(const a of data.provision.archives)a.stripComponents??=0;
for(const p of data.profiles)p.profileFile??='';
draw();
</script></body></html>
