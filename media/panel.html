<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__'"><title>Eclipse Remote Build</title>
<style nonce="__NONCE__">
*{box-sizing:border-box}body{margin:0;padding:20px;font:13px var(--vscode-font-family,system-ui);color:var(--vscode-foreground,#ddd);background:var(--vscode-editor-background,#181818)}button,input,textarea,select{font:inherit}button{border:1px solid transparent;border-radius:3px;padding:7px 11px;cursor:pointer;color:var(--vscode-button-secondaryForeground,#eee);background:var(--vscode-button-secondaryBackground,#333)}button.primary{background:var(--vscode-button-background,#087eb7);color:var(--vscode-button-foreground,#fff)}button:active{transform:translateY(1px)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus,textarea:focus,select:focus{outline:1px solid var(--vscode-focusBorder,#007fd4);outline-offset:1px}input,textarea,select{width:100%;min-width:0;padding:7px;border:1px solid var(--vscode-input-border,#555);border-radius:2px;color:var(--vscode-input-foreground,#eee);background:var(--vscode-input-background,#292929)}textarea{resize:vertical;min-height:72px;font-family:var(--vscode-editor-font-family,monospace)}input[readonly],textarea[readonly]{background:var(--vscode-editor-background,#181818)}header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}h1{font-size:20px;font-weight:600;margin:0 auto 0 0}h2{font-size:15px;font-weight:600;margin:0}h3{font-size:13px;margin:0 0 12px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;padding:12px 0;border-top:1px solid var(--vscode-panel-border,#444);border-bottom:1px solid var(--vscode-panel-border,#444)}.summary span{display:block}.summary strong{display:block;margin-top:4px;font-weight:500;overflow-wrap:anywhere}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0}.toolbar select{width:min(250px,100%)}.status{min-height:28px;padding:4px 0;overflow-wrap:anywhere}.error{color:var(--vscode-errorForeground,#f48771)}.dirty{color:var(--vscode-editorWarning-foreground,#cca700)}.tabs{display:flex;border-bottom:1px solid var(--vscode-panel-border,#444);margin-bottom:16px;gap:4px}.tabs button{background:none;color:inherit;border-radius:0;padding:10px 14px;border-bottom:2px solid transparent}.tabs button[aria-selected=true]{border-bottom-color:var(--vscode-focusBorder,#007fd4)}section[hidden]{display:none}.section-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 12px}.section-head h2{margin-right:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}.field{display:flex;flex-direction:column;min-width:0;gap:6px}.field label{overflow-wrap:anywhere}.wide{grid-column:1/-1}.pick{display:flex;gap:6px}.pick button{flex-shrink:0}.table-wrap{max-width:100%}table{table-layout:fixed;width:100%;border-collapse:collapse;margin-bottom:16px}th,td{padding:9px 8px;border-bottom:1px solid var(--vscode-panel-border,#444);text-align:left;overflow-wrap:anywhere;vertical-align:top}th{font-weight:500}td:first-child{padding-left:0}tr[aria-selected=true]{background:var(--vscode-list-inactiveSelectionBackground,#30343a)}td button{width:100%;text-align:left;background:none;color:inherit;white-space:normal;overflow-wrap:anywhere}.selected-mark{display:inline-block;width:16px}#resolved{margin:12px 0;overflow-wrap:anywhere}#editor{border-top:1px solid var(--vscode-panel-border,#444);padding-top:16px}.archive{border-top:1px solid var(--vscode-panel-border,#444);padding:14px 0}.archive .grid{grid-template-columns:minmax(0,2fr) minmax(0,2fr) minmax(90px,1fr)}.archive button.remove{margin-top:8px}.note-value{overflow-wrap:anywhere}@media(max-width:750px){body{padding:12px}.grid,.summary{grid-template-columns:1fr}.archive .grid{grid-template-columns:1fr}.wide{grid-column:auto}th,td{padding:8px 5px}.tabs button{padding:10px}.toolbar select{width:100%}}
</style></head><body>
<header><h1>Eclipse Remote Build</h1><span id="dirty"></span><button id="reload">読み直す</button><button id="save">設定を保存</button></header>
<div class="summary"><div><span>接続先</span><strong id="target">未設定</strong></div><div><span>適用構成</span><strong id="applied">—</strong></div></div>
<div class="toolbar"><select id="selected" aria-label="使用するプロファイル"></select><button class="primary" data-run="build">同期してビルド</button><button data-run="sync">同期のみ</button><button data-run="deploy">Dockerへデプロイ</button></div>
<div id="status" class="status" role="status" aria-live="polite">待機</div>
<div class="tabs" role="tablist" aria-label="設定分類"><button role="tab" id="tab-build" aria-controls="build" aria-selected="true">ビルド構成</button><button role="tab" id="tab-connection" aria-controls="connection" aria-selected="false" tabindex="-1">接続・転送</button><button role="tab" id="tab-docker" aria-controls="docker" aria-selected="false" tabindex="-1">Docker環境</button></div>
<section id="build" role="tabpanel" aria-labelledby="tab-build"><div class="section-head"><h2>プロファイル</h2><button id="addProfile">追加</button><button id="removeProfile">選択中を削除</button></div><div class="table-wrap"><table><thead><tr><th scope="col" style="width:25%">名前</th><th scope="col" style="width:27%">プロジェクト</th><th scope="col" style="width:18%">構成</th><th scope="col" style="width:30%">適用元</th></tr></thead><tbody id="profiles"></tbody></table></div><div id="editor"></div></section>
<section id="connection" role="tabpanel" aria-labelledby="tab-connection" hidden><div class="section-head"><h2>SSH接続</h2></div><div id="ssh" class="grid"></div><div class="section-head"><h2>転送対象</h2></div><div id="sync" class="grid"></div></section>
<section id="docker" role="tabpanel" aria-labelledby="tab-docker" hidden><div class="section-head"><h2>Docker</h2></div><div id="container" class="grid"></div><div class="section-head"><h2>展開アーカイブ</h2><button id="addArchive">追加</button></div><div id="archives"></div></section>
<script nonce="__NONCE__">
const vscode=acquireVsCodeApi(),initial=__DATA__;let data=initial.settings,raw=initial.raw||{},selected=initial.selected||0,errors={},effective=[],busy=false;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=p=>p.split('.').reduce((o,k)=>o?.[k],data);function set(p,v){const keys=p.split('.');let o=data;for(const k of keys.slice(0,-1))o=o[k];o[keys.at(-1)]=v;}
function field(label,p,{type='text',browse=false,list=false,json=false,value=get(p),readonly=false,wide=false}={}){const id='f-'+p.replace(/\./g,'-'),attr=json?'data-json':list?'data-list':'data-path';const val=json?JSON.stringify(value??{},null,2):list?(Array.isArray(value)?value.join('\n'):''):value;const control=(list||json)?'<textarea id="'+id+'" '+attr+'="'+p+'" '+(readonly?'readonly data-effective="'+p.split('.').at(-1)+'"':'')+'>'+esc(val)+'</textarea>':'<input id="'+id+'" '+attr+'="'+p+'" type="'+type+'" value="'+esc(val)+'" '+(readonly?'readonly data-effective="'+p.split('.').at(-1)+'"':'')+'>';return '<div class="field '+(wide?'wide':'')+'"><label for="'+id+'">'+esc(label)+'</label>'+(browse?'<div class="pick">'+control+'<button data-pick="'+p+'" aria-label="'+esc(label)+'を選択">選択</button></div>':control)+'</div>';}
function collect(){const env=document.querySelector('[data-json]:not([readonly])');if(env){raw[selected]=env.value;try{const value=JSON.parse(env.value);if(!value||Array.isArray(value)||typeof value!=='object')throw Error();data.profiles[selected].environment=value;delete errors[selected];}catch{errors[selected]='環境変数をJSONオブジェクトで入力してください';}}}
function sendDraft(id){collect();vscode.postMessage({type:'draft',id,settings:data,errors,raw,selected});}
function table(){ $('selected').innerHTML=data.profiles.map((p,i)=>'<option value="'+i+'">'+esc(p.name||'(未設定)')+'</option>').join('');$('selected').value=String(selected);$('profiles').innerHTML=data.profiles.map((p,i)=>{const e=effective[i],v=e?.profile;return '<tr aria-selected="'+(i===selected)+'"><td><button data-select="'+i+'" aria-label="'+esc(p.name||'プロファイル')+'を選択"><span class="selected-mark">'+(i===selected?'●':'○')+'</span>'+esc(p.name||'(未設定)')+'</button></td><td>'+esc(v?.project??'—')+'</td><td>'+esc(v?.configuration??'—')+'</td><td class="'+(e?.error?'error':'')+'">'+esc(e?.error||e?.origin||'解決中')+'</td></tr>';}).join('');$('removeProfile').disabled=busy||!data.profiles.length;}
function detail(){const p=data.profiles[selected];if(!p){$('editor').innerHTML='プロファイルがありません';return;}const b='profiles.'+selected+'.',external=!!p.profileFile,e=effective[selected],v=external?(e?.profile||p):p;const f=(label,key,opts={})=>field(label,b+key,{...opts,value:v[key],readonly:external});$('editor').innerHTML='<div class="grid">'+field('名前',b+'name')+field('構成JSON（ワークスペース相対）',b+'profileFile',{browse:true})+'</div><div id="resolved" class="note-value">'+esc(external?(e?.error||'適用元: '+p.profileFile):'適用元: 画面設定')+'</div>'+(external?'<button id="openProfile">構成JSONを編集</button>':'')+'<div class="grid" style="margin-top:14px">'+f('プロジェクト','project')+f('構成','configuration')+f('Eclipse実行ファイル（コンテナ内）','eclipseExecutable')+f('Eclipseワークスペース（コンテナ内）','eclipseWorkspace')+f('インポート元（ワークスペース相対・1行1件）','imports',{list:true})+f('追加引数（1行1引数）','extraArgs',{list:true})+f('環境変数（JSON）','environment',{json:true,wide:true})+'</div>';if(!external&&raw[selected]!==undefined)document.querySelector('[data-json]').value=raw[selected];disable();}
function updateEffective(){const p=data.profiles[selected];if(!p?.profileFile)return;const e=effective[selected];if(!e)return;$('resolved').textContent=e.error||'適用元: '+e.origin;document.querySelectorAll('[data-effective]').forEach(el=>{const k=el.dataset.effective,v=e.profile?.[k];el.value=k==='environment'?JSON.stringify(v??{},null,2):Array.isArray(v)?v.join('\n'):v??'';});}
function archives(){$('archives').innerHTML=data.provision.archives.map((a,i)=>{const b='provision.archives.'+i+'.';return '<div class="archive"><div class="grid">'+field('アーカイブ '+(i+1)+'（ワークスペース相対）',b+'source',{browse:true})+field('展開先（コンテナ内）',b+'destination')+field('除去する階層数',b+'stripComponents',{type:'number',value:a.stripComponents??0})+'</div><button class="remove" data-remove-archive="'+i+'">削除</button></div>';}).join('');disable();}
function draw(){table();detail();$('ssh').innerHTML=field('ホスト','ssh.host')+field('ユーザー','ssh.user')+field('ポート','ssh.port',{type:'number'})+field('秘密鍵','ssh.identityFile',{browse:true})+field('転送先（ホスト内の絶対パス）','remote.root',{wide:true});$('sync').innerHTML=field('ソース（ワークスペース相対・1行1件）','sync.include',{list:true})+field('除外パターン（1行1件）','sync.exclude',{list:true})+field('追加プロファイル（ワークスペース相対・1行1件）','sync.profileFiles',{list:true,wide:true});$('container').innerHTML=field('コンテナ名','remote.container')+field('Dockerコマンド','remote.dockerCommand')+field('作成するイメージ','provision.image')+field('ベースイメージ','provision.baseImage')+field('Dockerfile（空欄: 内蔵Ubuntu）','provision.dockerfile',{browse:true,wide:true});archives();disable();}
function disable(){document.querySelectorAll('input,textarea,select,button:not([role=tab])').forEach(el=>el.disabled=busy);$('removeProfile').disabled=busy||!data.profiles.length;}
function select(i){collect();selected=i;table();detail();sendDraft();}
function tab(id,focus=false){for(const name of ['build','connection','docker']){const active=name===id;$(name).hidden=!active;const b=$('tab-'+name);b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;if(active&&focus)b.focus();}vscode.setState({tab:id});}
document.addEventListener('input',e=>{const el=e.target;if(el.readOnly)return;if(el.dataset.path)set(el.dataset.path,el.type==='number'?Number(el.value):el.value);if(el.dataset.list)set(el.dataset.list,el.value.split(/\r?\n/).filter(v=>v.trim().length));if(el.dataset.path?.endsWith('.name'))table();sendDraft();});
document.addEventListener('change',e=>{if(e.target.dataset.path?.endsWith('.profileFile')){delete errors[selected];detail();sendDraft();}});
$('selected').addEventListener('change',e=>select(Number(e.target.value)));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.getAttribute('role')==='tab'){tab(b.id.slice(4));return;}if(b.dataset.run){sendDraft();vscode.postMessage({type:'run',action:b.dataset.run});return;}if(b.dataset.select!==undefined){select(Number(b.dataset.select));return;}if(b.dataset.pick){sendDraft();vscode.postMessage({type:'pick',field:b.dataset.pick});return;}if(b.id==='save'){sendDraft();vscode.postMessage({type:'save'});return;}if(b.id==='reload'){vscode.postMessage({type:'reload'});return;}if(b.id==='openProfile'){vscode.postMessage({type:'openProfile'});return;}collect();if(b.id==='addArchive'){data.provision.archives.push({source:'',destination:'/opt/eclipse',stripComponents:1});archives();sendDraft();}if(b.dataset.removeArchive!==undefined){data.provision.archives.splice(Number(b.dataset.removeArchive),1);archives();sendDraft();}if(b.id==='addProfile'){const template=data.profiles[selected]||{name:'',profileFile:'',project:'MyProject',configuration:'Debug',eclipseExecutable:'/opt/eclipse/eclipse',eclipseWorkspace:'/tmp/eclipse-workspace',imports:['.'],extraArgs:[],environment:{}};data.profiles.push({...structuredClone(template),name:'Profile '+(data.profiles.length+1),profileFile:''});selected=data.profiles.length-1;table();detail();sendDraft();}if(b.id==='removeProfile'&&data.profiles.length){data.profiles.splice(selected,1);const shift=m=>Object.fromEntries(Object.entries(m).filter(([k])=>Number(k)!==selected).map(([k,v])=>[Number(k)>selected?Number(k)-1:Number(k),v]));raw=shift(raw);errors=shift(errors);selected=Math.min(selected,Math.max(0,data.profiles.length-1));table();detail();sendDraft();}});
document.querySelector('.tabs').addEventListener('keydown',e=>{const names=['build','connection','docker'],i=names.indexOf(e.target.id.slice(4));let next;if(e.key==='ArrowRight')next=(i+1)%3;if(e.key==='ArrowLeft')next=(i+2)%3;if(e.key==='Home')next=0;if(e.key==='End')next=2;if(next!==undefined){e.preventDefault();tab(names[next],true);}});
window.addEventListener('message',e=>{const m=e.data;if(m.type==='requestDraft'){sendDraft(m.id);return;}if(m.type==='picked'){set(m.field,m.value);const el=document.querySelector('[data-path="'+m.field+'"]');if(el)el.value=m.value;if(m.field.endsWith('.profileFile')){delete errors[selected];detail();}sendDraft();return;}if(m.type==='error'){$('status').textContent=m.text;$('status').className='status error';return;}if(m.type==='state'){if(m.settings){data=m.settings;raw=m.raw||{};errors={};selected=m.selected;effective=m.effective||[];draw();}else{effective=m.effective||[];if(selected!==m.selected){collect();selected=m.selected;detail();}table();updateEffective();}const s=m.summary;if(s){busy=s.busy;$('target').textContent=s.host||'未設定';$('applied').textContent=s.configuration||'—';$('dirty').textContent=s.conflict?'外部変更あり':s.dirty?'未保存':'保存済み';$('dirty').className=s.dirty||s.conflict?'dirty':'';$('status').textContent=s.status;$('status').className='status'+(s.status.startsWith('エラー:')?' error':'');disable();}}});
draw();tab(vscode.getState()?.tab||'build');vscode.postMessage({type:'ready'});
</script></body></html>
